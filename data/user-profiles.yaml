  - user_id: "usr_amara_diallo"
    name: "Amara Diallo"
    age: 31
    location: "Minneapolis, MN — urban, Cedar-Riverside neighborhood"
    household: "Lives with her mother, aunt, and two younger cousins in a shared household"
    income_bracket: medium
    primary_motivation: "In my family, generosity means spending. When I visit Senegal, I'm expected to bring gifts for everyone. When someone here has a celebration, we all contribute money. I love my culture but I need to find my own balance."
    consumption_patterns:
      - category: "Gifts and remittances"
        frequency: "Monthly family obligations, plus celebrations"
        emotional_trigger: "Cultural duty, fear of being seen as selfish or too Americanized"
      - category: "Clothing and fashion"
        frequency: "Moderate, with spikes around cultural events"
        emotional_trigger: "Wanting to honor traditions, look appropriate for community gatherings"
      - category: "Household contributions"
        frequency: "Weekly shared expenses"
        emotional_trigger: "Responsibility as the highest earner in the household"
    values:
      - "Generosity is beautiful — I never want to lose that part of my culture"
      - "But I also deserve to build my own future, and that's not selfish"
      - "I want to find a way to be generous that doesn't mean I'm always broke by the 20th of the month"
    goals:
      - "Set boundaries on gift spending without damaging family relationships"
      - "Build personal savings while still contributing to the household"
      - "Find non-monetary ways to express generosity and love"
    challenges:
      - "Cultural expectations are powerful — opting out of gift-giving norms feels like rejecting her identity"
      - "Her mother sees Amara's income as family income, which creates tension"
      - "Western financial advice (just say no, set boundaries) ignores the communal economic model she was raised in"
    session_history_summary: "Amara has completed 9 sessions over 5 weeks. Sage adapted its approach after Amara pushed back on standard budgeting advice that felt culturally tone-deaf. Sessions now honor the communal economic model while helping Amara negotiate her own needs within it. She's drafting a proposal for her family about a shared savings pool that would protect everyone while letting individuals build personal reserves."

