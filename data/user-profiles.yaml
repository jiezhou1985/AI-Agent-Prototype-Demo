users:
  - user_id: "usr_maya_chen"
    name: "Maya Chen"
    age: 28
    location: "Chicago, IL — urban, Wicker Park neighborhood"
    household: "Lives alone in a one-bedroom apartment"
    income_bracket: medium
    primary_motivation: "I want to stop spending money on things that don't actually make me happy. I keep buying stuff after bad days at work and then feeling worse about it."
    consumption_patterns:
      - category: "Clothing and accessories"
        frequency: "2-4 online orders per week"
        emotional_trigger: "End-of-workday stress, comparison after scrolling Instagram"
      - category: "Skincare and beauty"
        frequency: "Weekly new product purchases"
        emotional_trigger: "Targeted ads that appear right when she's feeling insecure"
      - category: "Food delivery"
        frequency: "5-6 times per week"
        emotional_trigger: "Too tired to cook, treats it as self-care"
    values:
      - "I care about experiences over things — at least I want to"
      - "I believe in being honest with myself even when it's uncomfortable"
      - "I think creativity matters more than consumption"
    goals:
      - "Save $8,000 for a three-month trip to Southeast Asia"
      - "Go one full week without an impulse purchase"
      - "Find healthier ways to decompress after work"
    challenges:
      - "Recommendation algorithms know her patterns — she gets targeted at her most vulnerable moments"
      - "Her social circle treats shopping as bonding activity"
      - "Unsubscribing from marketing emails feels like it takes more willpower than she has at 10pm"
    session_history_summary: "Maya has completed 12 sessions over 6 weeks. Early sessions focused on awareness — mapping her spending to emotional states. She discovered her peak impulse window is 8-11pm on weekdays. She successfully implemented a 24-hour cart rule but broke it twice during a stressful project deadline. Recently asked Sage to help her find free creative outlets for evenings."

  - user_id: "usr_david_okafor"
