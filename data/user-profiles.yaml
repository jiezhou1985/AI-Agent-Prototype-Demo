        emotional_trigger: "Seeing what neighbors have, wanting to provide the 'best' for family"
      - category: "Children's activities, gear, and electronics"
        frequency: "Bi-weekly"
        emotional_trigger: "Guilt about working long hours, compensating with things"
      - category: "Cars and automotive"
        frequency: "New vehicle every 18-24 months"
        emotional_trigger: "Professional image, keeping up with colleagues"
    values:
      - "I want my kids to know that character matters more than what you own"
      - "Hard work should mean freedom, not a bigger treadmill"
      - "Being a good provider isn't the same as buying a lot"
