  - user_id: "usr_marcus_williams"
    name: "Marcus Williams"
    age: 22
    location: "Atlanta, GA — urban, near Georgia State campus"
    household: "Shares an apartment with two roommates"
    income_bracket: low
    primary_motivation: "I'm broke but I feel like I need all this stuff. Every podcast has an ad, every influencer is selling something. I want to figure out what I actually need vs. what I've been convinced I need."
    consumption_patterns:
      - category: "Tech accessories and gadgets"
        frequency: "1-2 purchases per month, often financed"
        emotional_trigger: "YouTube reviews, fear of missing out on productivity tools"
      - category: "Fitness supplements and gear"
        frequency: "Monthly subscription boxes"
        emotional_trigger: "Fitness influencer culture, body image pressure"
      - category: "Sneakers and streetwear"
        frequency: "Occasional drops, but researches constantly"
        emotional_trigger: "Social identity, peer group culture"
    values:
      - "I want to build real wealth, not just look like I have it"
      - "Being smart with money is a skill no one taught me"
      - "I don't want to be manipulated by companies that see me as a demographic"
    goals:
      - "Distinguish between genuine needs and manufactured wants"
      - "Cancel at least three subscriptions he's paying for but not using"
      - "Build a basic emergency fund"
    challenges:
      - "Advertising targeting young Black men is relentless and sophisticated"
      - "Some purchases are genuine needs he can't afford — the line between want and need is genuinely blurry"
      - "Buy-now-pay-later makes everything feel affordable until it isn't"
    session_history_summary: "Marcus has completed 6 sessions over 3 weeks. He started skeptical but engaged after Sage helped him calculate that his unused subscriptions totaled $127/month. Currently working on an ad-literacy exercise — tracking every ad he encounters for a week and rating whether it created a need he didn't have before. He's also using Sage's need-vs-want framework before purchases."

  - user_id: "usr_linda_bergstrom"
    name: "Linda Bergstrom"
    age: 67
    location: "Eau Claire, WI — rural outskirts"
    household: "Lives alone in the house she shared with her late husband Glenn"
    income_bracket: low
    primary_motivation: "I know I buy things I don't need from the TV. I'm not stupid about it. I just... it fills the quiet. My daughter wants me to stop and she's right, but she doesn't understand the quiet."
    consumption_patterns:
      - category: "Home shopping network items"
        frequency: "3-5 orders per week"
        emotional_trigger: "Loneliness, especially evenings and weekends. The hosts feel like company."
      - category: "Kitchen gadgets and home decor"
        frequency: "Weekly"
        emotional_trigger: "Nostalgia for when she cooked for Glenn, imagining a more beautiful home"
      - category: "Gifts for grandchildren"
        frequency: "Bi-weekly"
        emotional_trigger: "Wanting to feel needed, maintaining connection"
    values:
      - "I raised three kids on a teacher's salary and never wasted a dime — I don't know how I got here"
      - "Connection with people is what matters, but it's hard to find at my age"
      - "I don't want to be a burden, and I don't want to leave my kids a house full of junk"
    goals:
      - "Reduce clutter — two spare rooms are now full of unopened packages"
      - "Find real social connection to replace parasocial TV relationships"
      - "Feel in control of her finances again before they become a problem"
    challenges:
      - "Loneliness is the root cause — reducing spending without addressing it will fail"
      - "Limited mobility and rural location make in-person socializing harder"
      - "Her daughter's approach (criticism, taking away the remote) has created shame"
    session_history_summary: "Linda has completed 20 sessions over 10 weeks, making her one of the most engaged users. She initially resisted the idea that loneliness drove her buying, but opened up in session 5. Sage helped her find a virtual book club and a local senior center with a shuttle service. Her ordering has decreased from 4-5 per week to 1-2. She still watches the shopping channels but now texts her daughter during them instead of ordering."

